name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # 先装非 maimai-py 的依赖，maimai-py 装失败不阻断测试（相关测试会 skip）
          pip install "aiohttp>=3.8.5" "aiofiles>=23.2.1" "Pillow>=10.0.0" "pydantic>=2.4.2" "numpy>=1.24.4" || true
          # maimai-py 提供二进制 wheel，尽力安装；失败则相关用例 skip
          pip install "maimai-py==1.6.0" || true

      - name: Run tests
        run: |
          python -m pytest tests -q

      - name: Smoke check plugin import
        run: |
          python -c "import ast; ast.parse(open('main.py', encoding='utf-8').read()); print('main.py AST OK')"
